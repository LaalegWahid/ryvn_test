name: Build & Release notes

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "notes-api/**"
      - ".github/workflows/ryvn-notes-release.yaml"
  pull_request:
    paths:
      - "notes-api/**"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: notes
    permissions:
      contents: write
      id-token: write
    secrets:
      RYVN_CLIENT_ID: ${{ secrets.RYVN_CLIENT_ID }}
      RYVN_CLIENT_SECRET: ${{ secrets.RYVN_CLIENT_SECRET }}
